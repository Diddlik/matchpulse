name: Build and release

# Every push and pull request: build and test.
# A tag like v1.2.3: also publish, build the installer and create the GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x
      # The fixture clips are not in the public repo, so their replay tests run only locally.
      - name: Test
        run: dotnet test MatchPulse.slnx -c Release --filter "FullyQualifiedName!~FixtureClipTests"

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x

      - name: Version from tag
        shell: pwsh
        run: echo "VERSION=$($env:VERSION.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Publish
        run: dotnet publish src/MatchPulse -c Release -r win-x64 --self-contained -p:Version=${{ env.VERSION }} -o publish

      - name: Installer and portable zip
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc /Q /DAppVersion=$env:VERSION /DSourceDir=..\publish installer\MatchPulse.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive publish\* artifacts\MatchPulse-$env:VERSION-portable-win-x64.zip
          # Update manifest for MatchPulse's auto-update (read from releases/latest/download/latest.json).
          $installer = "MatchPulse-Setup-$env:VERSION.exe"
          $sha = (Get-FileHash "artifacts\$installer" -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ version = $env:VERSION; installer = $installer; sha256 = $sha } | ConvertTo-Json | Set-Content artifacts\latest.json -Encoding utf8NoBOM

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifacts/*
          generate_release_notes: true
