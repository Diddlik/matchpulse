<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7d8590"/>
    </marker>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4452"/>
      <stop offset="0.62" stop-color="#4b5563"/>
      <stop offset="0.62" stop-color="#4a5046"/>
      <stop offset="1" stop-color="#3d4239"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="560" rx="18" fill="#0f1217"/>

  <!-- Step titles -->
  <g font-size="13" font-weight="700" fill="#7d8590" letter-spacing="1.2">
    <text x="40" y="44">1  YOU PLAY</text>
    <text x="360" y="44">2  MATCHPULSE WATCHES</text>
    <text x="700" y="44">3  GAME EVENT</text>
    <text x="960" y="44">4  YOUR TOOLS REACT</text>
  </g>

  <!-- 1: game screen -->
  <g transform="translate(40 66)">
    <rect width="270" height="170" rx="8" fill="url(#screen)" stroke="#2d333b" stroke-width="2"/>
    <rect x="186" y="12" width="72" height="16" rx="3" fill="#000" opacity="0.45"/>
    <rect x="192" y="18" width="22" height="4" rx="2" fill="#7fc4ff"/>
    <rect x="220" y="18" width="32" height="4" rx="2" fill="#d8dce2"/>
    <rect x="18" y="12" width="70" height="14" rx="3" fill="#000" opacity="0.35"/>
    <path d="M135 80v6M135 92v6M126 89h6M138 89h6" stroke="#f2f2f2" stroke-width="2" stroke-linecap="round"/>
    <path d="M118 72l8 8M152 72l-8 8M118 106l8-8M152 106l-8-8" stroke="#ff3b3b" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(135 132)">
      <circle r="9" fill="#f2f2f2"/><rect x="-5" y="5" width="10" height="6" rx="1.5" fill="#f2f2f2"/>
      <circle cx="-3.3" cy="-1" r="2.2" fill="#3d4239"/><circle cx="3.3" cy="-1" r="2.2" fill="#3d4239"/>
    </g>
    <text x="152" y="137" font-size="12" font-weight="700" fill="#e6edf3">+100</text>
    <rect x="95" y="170" width="80" height="8" fill="#2d333b"/>
    <rect x="70" y="178" width="130" height="6" rx="3" fill="#2d333b"/>
  </g>
  <text x="40" y="282" font-size="15" font-weight="600" fill="#e6edf3">Battlefield 6</text>
  <text x="40" y="304" font-size="13" fill="#9198a1">REDSEC or multiplayer,</text>
  <text x="40" y="322" font-size="13" fill="#9198a1">fullscreen, any resolution</text>

  <!-- arrow 1 -> 2 -->
  <path d="M318 150H352" stroke="#7d8590" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 2: detection -->
  <g transform="translate(360 66)">
    <rect width="300" height="300" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="34" font-size="15" font-weight="600" fill="#e6edf3">Screen capture</text>
    <text x="20" y="54" font-size="12.5" fill="#9198a1">5–10 checks per second, only small</text>
    <text x="20" y="71" font-size="12.5" fill="#9198a1">areas of the screen, never the game process</text>
    <line x1="20" y1="88" x2="280" y2="88" stroke="#30363d"/>
    <text x="20" y="114" font-size="15" font-weight="600" fill="#e6edf3">Cue detection</text>
    <g font-size="12.5" fill="#c9d1d9">
      <path d="M26 132l8 8M42 132l-8 8M26 148l8-8M42 148l-8-8" stroke="#ff3b3b" stroke-width="2.6" stroke-linecap="round"/>
      <text x="56" y="144">Kill Marker around the crosshair</text>
      <g transform="translate(34 172)"><circle r="7" fill="#e6edf3"/><rect x="-4" y="4" width="8" height="5" rx="1" fill="#e6edf3"/><circle cx="-2.5" cy="-1" r="1.8" fill="#161b22"/><circle cx="2.5" cy="-1" r="1.8" fill="#161b22"/></g>
      <text x="56" y="177">Skull in the score popup</text>
      <rect x="24" y="196" width="20" height="10" rx="2" fill="none" stroke="#7fc4ff" stroke-width="2"/>
      <text x="56" y="206">Match HUD bar</text>
      <path d="M34 222l9 4v7c0 5-4 8-9 10-5-2-9-5-9-10v-7z" fill="none" stroke="#e3b341" stroke-width="2"/>
      <text x="56" y="238">Victory / defeat emblem</text>
      <rect x="22" y="252" width="24" height="10" rx="2" fill="#30363d"/>
      <text x="56" y="263">Spectate label (death)</text>
    </g>
    <text x="20" y="288" font-size="11.5" fill="#7d8590">Template matching (OpenCV), any resolution</text>
  </g>

  <!-- arrow 2 -> 3 -->
  <path d="M668 216H692" stroke="#7d8590" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 3: event -->
  <g transform="translate(700 66)">
    <rect width="232" height="300" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <g font-size="12.5" font-weight="600">
      <rect x="18" y="20" width="110" height="24" rx="6" fill="#1f6feb" opacity="0.25"/><text x="28" y="37" fill="#79c0ff">match_started</text>
      <rect x="18" y="52" width="50" height="24" rx="6" fill="#da3633" opacity="0.3"/><text x="28" y="69" fill="#ff7b72">kill</text>
      <rect x="76" y="52" width="88" height="24" rx="6" fill="#30363d"/><text x="86" y="69" fill="#c9d1d9">knockdown</text>
      <rect x="18" y="84" width="58" height="24" rx="6" fill="#30363d"/><text x="28" y="101" fill="#c9d1d9">death</text>
      <rect x="84" y="84" width="104" height="24" rx="6" fill="#30363d"/><text x="94" y="101" fill="#c9d1d9">match_ended</text>
    </g>
    <rect x="18" y="124" width="196" height="156" rx="8" fill="#0d1117" stroke="#30363d"/>
    <g font-family="Cascadia Code, Consolas, monospace" font-size="11.5">
      <text x="30" y="148" fill="#9198a1">{</text>
      <text x="42" y="168"><tspan fill="#79c0ff">"type"</tspan><tspan fill="#9198a1">: </tspan><tspan fill="#ff7b72">"kill"</tspan><tspan fill="#9198a1">,</tspan></text>
      <text x="42" y="188"><tspan fill="#79c0ff">"matchId"</tspan><tspan fill="#9198a1">: </tspan><tspan fill="#a5d6ff">"91fd…"</tspan><tspan fill="#9198a1">,</tspan></text>
      <text x="42" y="208"><tspan fill="#79c0ff">"sequence"</tspan><tspan fill="#9198a1">: </tspan><tspan fill="#e3b341">4</tspan><tspan fill="#9198a1">,</tspan></text>
      <text x="42" y="228"><tspan fill="#79c0ff">"occurredAt"</tspan><tspan fill="#9198a1">: …,</tspan></text>
      <text x="42" y="248"><tspan fill="#79c0ff">"data"</tspan><tspan fill="#9198a1">: {</tspan><tspan fill="#79c0ff">"kills"</tspan><tspan fill="#9198a1">:</tspan><tspan fill="#a5d6ff">"3"</tspan><tspan fill="#9198a1">}</tspan></text>
      <text x="30" y="268" fill="#9198a1">}</text>
    </g>
  </g>

  <!-- arrows 3 -> 4 -->
  <g stroke="#7d8590" stroke-width="2.5" fill="none">
    <path d="M940 216C950 216 945 104 956 104" marker-end="url(#arrow)"/>
    <path d="M940 216C950 216 945 178 956 178" marker-end="url(#arrow)"/>
    <path d="M940 216C950 216 945 252 956 252" marker-end="url(#arrow)"/>
    <path d="M940 216C950 216 945 326 956 326" marker-end="url(#arrow)"/>
  </g>

  <!-- 4: sinks -->
  <g transform="translate(960 70)" font-size="13">
    <g>
      <rect width="200" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <path d="M18 22h18M30 16l6 6-6 6M18 38h12" stroke="#79c0ff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="50" y="27" font-weight="600" fill="#e6edf3">Webhooks &amp; MQTT</text>
      <text x="50" y="45" font-size="11.5" fill="#9198a1">HTTP POST, MQTT publish</text>
    </g>
    <g transform="translate(0 74)">
      <rect width="200" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <path d="M18 20l7 6-7 6M28 36h10" stroke="#7ee787" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="50" y="27" font-weight="600" fill="#e6edf3">Scripts</text>
      <text x="50" y="45" font-size="11.5" fill="#9198a1">JSON on stdin</text>
    </g>
    <g transform="translate(0 148)">
      <rect width="200" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="28" cy="30" r="11" fill="none" stroke="#d2a8ff" stroke-width="2"/><circle cx="28" cy="30" r="4" fill="#d2a8ff"/>
      <text x="50" y="27" font-weight="600" fill="#e6edf3">OBS plugin</text>
      <text x="50" y="45" font-size="11.5" fill="#9198a1">record, replay, chapters</text>
    </g>
    <g transform="translate(0 222)">
      <rect width="200" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <rect x="16" y="18" width="24" height="17" rx="2" fill="none" stroke="#ffa657" stroke-width="2"/><path d="M22 41h12" stroke="#ffa657" stroke-width="2"/>
      <text x="50" y="27" font-weight="600" fill="#e6edf3">MatchPulse window</text>
      <text x="50" y="45" font-size="11.5" fill="#9198a1">events, live monitor, log</text>
    </g>
  </g>

  <!-- footer band -->
  <rect x="40" y="400" width="1120" height="1" fill="#30363d"/>
  <g font-size="13.5" fill="#9198a1">
    <g transform="translate(40 438)">
      <circle cx="8" cy="-5" r="8" fill="#238636" opacity="0.3"/><path d="M4 -5l3 3 5-6" stroke="#7ee787" stroke-width="2" fill="none"/>
      <text x="26" y="0" fill="#e6edf3" font-weight="600">Read-only</text>
      <text x="26" y="20">Like recording software: no hooks,</text>
      <text x="26" y="38">no memory reading, no injection.</text>
    </g>
    <g transform="translate(330 438)">
      <circle cx="8" cy="-5" r="8" fill="#238636" opacity="0.3"/><path d="M4 -5l3 3 5-6" stroke="#7ee787" stroke-width="2" fill="none"/>
      <text x="26" y="0" fill="#e6edf3" font-weight="600">Light</text>
      <text x="26" y="20">Only small screen areas are copied;</text>
      <text x="26" y="38">idle while the game is closed.</text>
    </g>
    <g transform="translate(620 438)">
      <circle cx="8" cy="-5" r="8" fill="#238636" opacity="0.3"/><path d="M4 -5l3 3 5-6" stroke="#7ee787" stroke-width="2" fill="none"/>
      <text x="26" y="0" fill="#e6edf3" font-weight="600">Your kills only</text>
      <text x="26" y="20">Kills the Squad finishes are</text>
      <text x="26" y="38">not counted, even under a Jammer.</text>
    </g>
    <g transform="translate(910 438)">
      <circle cx="8" cy="-5" r="8" fill="#238636" opacity="0.3"/><path d="M4 -5l3 3 5-6" stroke="#7ee787" stroke-width="2" fill="none"/>
      <text x="26" y="0" fill="#e6edf3" font-weight="600">Within a second</text>
      <text x="26" y="20">Events arrive about 0.5 s</text>
      <text x="26" y="38">after the kill.</text>
    </g>
  </g>
</svg>
